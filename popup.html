<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>YouTube PiP settings</title>
    <style>
      body {
        width: 280px;
        margin: 16px;
        background: #171717;
        color: #eee;
        font: 14px system-ui;
      }
      h1 {
        font-size: 16px;
      }
      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: 14px 0;
      }
      select,
      button {
        background: #333;
        color: inherit;
        border: 1px solid #777;
        border-radius: 4px;
        padding: 5px;
      }
      input[type='range'] {
        width: 110px;
      }
      .active {
        outline: 2px solid #e55;
      }
      .preview {
        margin: 18px 0;
        padding: 16px 4px;
        background: #555;
        text-align: center;
      }
      #preview-text {
        padding: 4px;
      }
      #save-indicator {
        visibility: hidden;
        margin-left: 12px;
      }
      #save-indicator.show {
        visibility: visible;
      }
    </style>
  </head>
  <body>
    <h1>YouTube PiP subtitles</h1>
    <label
      >Size <span id="font-size-val">16px</span>
      <input aria-label="Subtitle size" type="range" id="font-size" min="10" max="32" value="16" />
    </label>
    <label
      >Font
      <select id="font-family">
        <option>Trebuchet MS</option>
        <option>Arial</option>
        <option>Verdana</option>
        <option>sans-serif</option>
      </select>
    </label>
    <label
      >Text color <input aria-label="Text color" type="color" id="text-color" value="#ffffff"
    /></label>
    <label
      >Background <span id="bg-opacity-val">75%</span>
      <input
        aria-label="Background opacity"
        type="range"
        id="bg-opacity"
        min="0"
        max="100"
        value="75"
        step="5"
      />
    </label>
    <div>
      Position
      <button class="toggle-btn active" data-pos="bottom">Bottom</button>
      <button class="toggle-btn" data-pos="top">Top</button>
    </div>
    <div class="preview"><span id="preview-text">Subtitle preview</span></div>
    <button id="reset-btn">Reset</button><span id="save-indicator" role="status">Saved</span>
    <script src="popup.js"></script>
  </body>
</html>
